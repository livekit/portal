name: License Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check License Headers
        shell: bash
        run: |
          shopt -s globstar
          docker run -v ${PWD}:/src ghcr.io/google/addlicense \
            -check \
            -l apache \
            -c "LiveKit, Inc." \
            -ignore "target/**/*" \
            -ignore "examples/**/*" \
             **/*.{rs,py}
