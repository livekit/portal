name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# One publish run at a time. A second tag push waits; it does not cancel the
# in-flight run because cancelling a half-uploaded publish is worse than
# letting it finish.
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# System libraries required to link the livekit-portal Rust cdylib on Linux.
# Mirrors the list in tests.yml so the two stay in sync.
env:
  LINUX_SYSTEM_DEPS: >-
    libssl-dev
    libglib2.0-dev
    libx11-dev
    libxext-dev
    libxfixes-dev
    libxdamage-dev
    libxrandr-dev
    libxcomposite-dev
    libgl1-mesa-dev
    libgbm-dev
    libdrm-dev
    libva-dev

jobs:
  # ---------------------------------------------------------------------------
  # Build — native wheels (per platform) + pure Python wheels/sdists.
  #
  # fetch-depth: 0 is required on every build job: hatch-vcs walks the full
  # git history to derive the package version from the triggering tag. A
  # shallow clone produces a dev/fallback version instead of the real one.
  # ---------------------------------------------------------------------------

  build-native:
    name: Build native wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04        # Linux x86_64  (glibc 2.35 -> manylinux floor)
          - ubuntu-22.04-arm    # Linux aarch64 (glibc 2.35 -> manylinux floor)
          - macos-latest        # macOS arm64   (Apple Silicon)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so hatch-vcs resolves the version tag

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $LINUX_SYSTEM_DEPS

      # NVENC has no cargo feature: webrtc-sys compiles its NVIDIA encoder only
      # when cuda.h is on disk, so every wheel published before this shipped
      # software-only H264. cuda.h is all it needs — the NVENC headers are
      # vendored and the NVIDIA libraries are dlopened, so the wheel still runs
      # with no GPU. Has to land before the first cargo build.
      - name: Install CUDA headers for NVENC (Linux x86_64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          . /etc/os-release
          repo="ubuntu${VERSION_ID//./}"  # NVIDIA's naming: ubuntu2204, ubuntu2404
          curl -fsSL -o /tmp/cuda-keyring.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/$repo/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update -y
          sudo apt-get install -y cuda-cudart-dev-12-6
          test -f /usr/local/cuda/include/cuda.h

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Compile the Rust cdylib and generate the UniFFI Python module.
      # Both land in livekit/portal/ so hatchling picks them up as wheel
      # artifacts (see [tool.hatch.build.targets.wheel] in pyproject.toml).
      - name: Build FFI cdylib and generate Python bindings
        run: bash scripts/build_ffi_python.sh release
        shell: bash

      - name: Build livekit-portal wheel
        working-directory: python
        run: uv build --package livekit-portal --wheel

      # PyPI rejects plain linux_* tags — retag as manylinux_<glibc>_<arch>.
      # The binary still requires system libs (X11, GLib, etc.) at runtime,
      # which is expected for a robotics library on a desktop/embedded OS.
      - name: Retag Linux wheel as manylinux
        if: runner.os == 'Linux'
        working-directory: python
        run: |
          glibc=$(python3 -c "import platform; v=platform.libc_ver()[1]; print(v.replace('.','_'))")
          arch=$(python3 -c "import platform; print(platform.machine())")
          uvx --from wheel wheel tags --platform-tag "manylinux_${glibc}_${arch}" --remove dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-native-${{ matrix.os }}
          path: python/dist/*.whl

  build-pure:
    name: Build pure Python packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so hatch-vcs resolves the version tag

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # uv build replaces the workspace source for livekit-portal with a
      # plain PyPI dependency in the generated wheel metadata.
      - name: Build lerobot-robot-livekit
        working-directory: python
        run: uv build --package lerobot-robot-livekit

      - name: Build lerobot-teleoperator-livekit
        working-directory: python
        run: uv build --package lerobot-teleoperator-livekit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-pure
          path: python/dist/

  # ---------------------------------------------------------------------------
  # Publish — upload every collected artifact to PyPI.
  #
  # Uses OIDC trusted publishing: no API key is stored in GitHub secrets.
  # Configure each package's trusted publisher at pypi.org with:
  #   Repository: livekit/portal
  #   Workflow:   publish.yml
  #   Environment: pypi
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-native, build-pure]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publisher

    steps:
      - name: Download livekit-portal artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-native-*
          path: dist/livekit-portal
          merge-multiple: true

      - name: Download lerobot artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-pure
          path: dist/lerobot

      - name: Show collected distributions
        run: ls -lhR dist/

      # Published separately so a missing pending publisher on one package
      # does not block the others. skip-existing makes re-runs safe.
      - name: Publish livekit-portal
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/livekit-portal/
          skip-existing: true

      - name: Publish lerobot packages
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/lerobot/
          skip-existing: true
