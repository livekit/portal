name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Everything linked into the livekit Rust SDK's WebRTC pipeline needs these on
# Ubuntu — `glib-sys` surfaces first via pkg-config (`glib-2.0.pc`), the rest
# come from the media/capture transitive deps. Matches livekit/rust-sdks' own
# CI recipe, minus the desktop-capture and NVIDIA bits we don't compile.
env:
  LIVEKIT_SERVER_VERSION: 1.13.5
  LINUX_SYSTEM_DEPS: >-
    libssl-dev
    libglib2.0-dev
    libx11-dev
    libxext-dev
    libxfixes-dev
    libxdamage-dev
    libxrandr-dev
    libxcomposite-dev
    libgl1-mesa-dev
    libgbm-dev
    libdrm-dev
    libva-dev

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $LINUX_SYSTEM_DEPS

      # webrtc-sys 0.3.44+ needs clang 21+ for libwebrtc's hermetic libc++;
      # the runner ships clang 18. Sets CC/CXX for the steps below.
      - name: Install clang for webrtc-sys
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # TODO: consider moving to separate job
      - name: Lint
        uses: clechasseur/rs-clippy-check@20f338ad6648dedb921c00b023bc30c971ab9ed7 # v6.0.7

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $LINUX_SYSTEM_DEPS

      # webrtc-sys 0.3.44+ needs clang 21+ for libwebrtc's hermetic libc++;
      # the runner ships clang 18. Sets CC/CXX for the steps below.
      - name: Install clang for webrtc-sys
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ensure lockfiles are up to date
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd python && uv lock --check)

      - name: Build FFI cdylib and generate Python bindings
        run: bash scripts/build_ffi_python.sh release

      - name: Install workspace (livekit-portal + dev deps)
        working-directory: python
        run: uv sync --group dev

      # Integration tests skip themselves without `LIVEKIT_URL`, so a dev
      # server is what turns them on.
      - name: Start LiveKit dev server
        run: |
          curl -sSfL "https://github.com/livekit/livekit/releases/download/v${LIVEKIT_SERVER_VERSION}/livekit_${LIVEKIT_SERVER_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" livekit-server
          "$RUNNER_TEMP/livekit-server" --dev > "$RUNNER_TEMP/livekit-server.log" 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:7880 > /dev/null; do sleep 0.5; done'

      - name: Run pytest
        working-directory: python
        env:
          LIVEKIT_URL: ws://localhost:7880
        run: uv run pytest packages/livekit-portal/tests -v

      - name: Run stress tests
        if: github.event_name == 'workflow_dispatch'
        working-directory: python
        env:
          LIVEKIT_URL: ws://localhost:7880
        run: uv run pytest packages/livekit-portal/tests -v -m stress

      - name: LiveKit server log
        if: failure()
        run: cat "$RUNNER_TEMP/livekit-server.log"
