name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Everything linked into the livekit Rust SDK's WebRTC pipeline needs these on
# Ubuntu — `glib-sys` surfaces first via pkg-config (`glib-2.0.pc`), the rest
# come from the media/capture transitive deps. Matches livekit/rust-sdks' own
# CI recipe, minus the desktop-capture and NVIDIA bits we don't compile.
env:
  LINUX_SYSTEM_DEPS: >-
    libssl-dev
    libglib2.0-dev
    libx11-dev
    libxext-dev
    libxfixes-dev
    libxdamage-dev
    libxrandr-dev
    libxcomposite-dev
    libgl1-mesa-dev
    libgbm-dev
    libdrm-dev
    libva-dev

jobs:
  # livekit-portal-core has no LiveKit, WebRTC or system deps, so it builds and tests
  # in seconds and must keep building for the browser.
  livekit-portal-core:
    name: livekit-portal-core (native + wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: cargo test -p livekit-portal-core
        run: cargo test -p livekit-portal-core --locked

      - name: cargo build -p livekit-portal-core (wasm32)
        run: cargo build -p livekit-portal-core --locked --target wasm32-unknown-unknown

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $LINUX_SYSTEM_DEPS

      # webrtc-sys 0.3.44+ needs clang 21+ for libwebrtc's hermetic libc++;
      # the runner ships clang 18. Sets CC/CXX for the steps below.
      - name: Install clang for webrtc-sys
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # yuv-sys renames libyuv's symbols only when it first copies libyuv into
      # OUT_DIR. A run cancelled mid-rename gets cached (cache-on-failure), and
      # every build from that cache then fails with "use of undeclared
      # identifier 'rs_...'". Drop the copy so the build script redoes it.
      - name: Drop cached yuv-sys sources
        run: rm -rf target/*/build/yuv-sys-*/out/libyuv
        shell: bash

      # TODO: consider moving to separate job
      - name: Lint
        uses: clechasseur/rs-clippy-check@ac75e246ebbd78d106ac9460c668ab7c8044ebe3 # v6.1.1

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y $LINUX_SYSTEM_DEPS

      # webrtc-sys 0.3.44+ needs clang 21+ for libwebrtc's hermetic libc++;
      # the runner ships clang 18. Sets CC/CXX for the steps below.
      - name: Install clang for webrtc-sys
        run: .github/scripts/install-clang.sh

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # yuv-sys renames libyuv's symbols only when it first copies libyuv into
      # OUT_DIR. A run cancelled mid-rename gets cached (cache-on-failure), and
      # every build from that cache then fails with "use of undeclared
      # identifier 'rs_...'". Drop the copy so the build script redoes it.
      - name: Drop cached yuv-sys sources
        run: rm -rf target/*/build/yuv-sys-*/out/libyuv
        shell: bash

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ensure lockfiles are up to date
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd python && uv lock --check)

      - name: Build FFI cdylib and generate Python bindings
        run: bash scripts/build_ffi_python.sh release

      - name: Install workspace (livekit-portal + dev deps)
        working-directory: python
        run: uv sync --group dev

      # Integration tests skip themselves without `LIVEKIT_URL`, so a dev
      # server is what turns them on.
      - name: Start LiveKit dev server
        id: livekit
        uses: livekit/dev-server-action@5d4d5337a875e2d1afd37bed03c601d159dab002 # v1.1.1
        with:
          github-token: ${{ github.token }}
          version: v1.13.5

      - name: Run pytest
        working-directory: python
        env:
          LIVEKIT_URL: ws://localhost:7880
        run: uv run pytest packages/livekit-portal/tests -v

      - name: Run stress tests
        if: github.event_name == 'workflow_dispatch'
        working-directory: python
        env:
          LIVEKIT_URL: ws://localhost:7880
        run: uv run pytest packages/livekit-portal/tests -v -m stress

      - name: LiveKit server log
        if: failure()
        run: cat "${{ steps.livekit.outputs.log-path }}"
