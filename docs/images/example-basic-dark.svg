<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">Basic example</title>
<desc id="d">robot.py streams video and state into a LiveKit room. teleoperator.py takes control, reads observations and sends actions back. observer.py records everything to an .rrd archive and marks takes with keypoints.</desc>
