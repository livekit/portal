<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">Benchmark across regions</title>
<desc id="d">Robot in San Francisco, teleoperator in Hanoi, on LiveKit Cloud, 640x480 H264 at 30 fps. Video about 124 ms and state about 111 ms to the teleoperator, observation at about 124 ms, action about 111 ms back, loop 235.1 ms. The direct ping round trip is 184.1 ms; Portal adds about 1.5 ms over plain LiveKit.</desc>
