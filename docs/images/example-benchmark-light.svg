<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">Benchmark example</title>
<desc id="d">Latency of each stream from one shared capture timestamp, measured on a local server with 640x480 H264 at 30 fps: send 0.2 ms, state 1.2 ms, video 5.9 ms, observation 6.2 ms, action 0.5 ms, full loop 6.8 ms.</desc>
<style>
.trace { opacity: 0; filter: drop-shadow(0 0 2px #002CF2); animation-name: trace; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes trace { 0% { stroke-dashoffset: 28px; opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: calc(-1 * var(--len)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trace { display: none; } }
</style>
