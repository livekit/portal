<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">SO-101 example</title>
<desc id="d">On the robot side, robot.py wraps the SO-101 follower and its camera with LiveKitTeleoperator. On the operator side, teleoperator.py wraps the remote follower as a local LiveKitRobot driven by an SO-101 leader, and shows the session in a Rerun viewer. Both meet in one LiveKit room.</desc>
