<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
<title id="t">One LiveKit room</title>
<desc id="d">The robot, a policy, a human operator and a recorder share one LiveKit room. Video and data travel as tracks, the active operator is a participant attribute, and everyone shares the robot&#x27;s clock.</desc>
<style>
.trace { opacity: 0; filter: drop-shadow(0 0 2px #1FD5F9); animation-name: trace; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes trace { 0% { stroke-dashoffset: 28px; opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: calc(-1 * var(--len)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trace { display: none; } }
</style>
