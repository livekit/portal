="262" width="101.99999999999999" height="18" rx="4" fill="#9D4D06" fill-opacity="0.14"/><text x="421.0" y="274.3" text-anchor="middle" font-family="'CommitMono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="0.6" fill="#9D4D06">CLOCKS DISAGREE</text><path d="M423,52 L423,92" fill="none" stroke="#707070" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M598,52 L598,92" fill="none" stroke="#707070" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="225" y="42" text-anchor="start" font-family="'CommitMono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" letter-spacing="1" fill="#707070">SESSION</text>
