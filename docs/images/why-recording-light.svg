<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" role="img" aria-labelledby="t d">
<title id="t">What a naive recorder keeps</title>
<desc id="d">A session where a policy drives, a human corrects, and the policy resumes. A recorder that logs only teleop inputs loses the policy&#x27;s attempt, and per-machine logs disagree on time.</desc>
<style>
.trace { opacity: 0; filter: drop-shadow(0 0 2px #002CF2); animation-name: trace; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes trace { 0% { stroke-dashoffset: 28px; opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: calc(-1 * var(--len)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trace { display: none; } }
</style>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="6" x2="6" y2="0" stroke="#BDBDBB" stroke-width="1.5" stroke-opacity="0.3"/></pattern>
<radialGradient id="fade" cx="50%" cy="50%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gridmask"><rect width="850" height="300" fill="url(#fade)"/></mask>
</defs>
<rect width="850" height="300" rx="10" fill="#FFFFFF"/>
