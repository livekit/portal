# The wire contract every role loads: tracks, schemas and fps. Identity and
# room are set in code, so one file serves the robot, teleoperator and observer.

version: 1

fps: 30

videos:
  - { name: cam1, codec: h264 }

# Mixed-dtype state and action schema. Both peers must declare the same
# fields in the same order; a fingerprint mismatch drops the packets.
state:
  - { name: j1, dtype: f32 }
  - { name: j2, dtype: f32 }
  - { name: j3, dtype: f32 }
  - { name: gripper, dtype: bool }
  - { name: mode, dtype: i8 }

action:
  - { name: j1, dtype: f32 }
  - { name: j2, dtype: f32 }
  - { name: j3, dtype: f32 }
  - { name: gripper, dtype: bool }
  - { name: mode, dtype: i8 }
