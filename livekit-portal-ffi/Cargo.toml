[package]
name = "livekit-portal-ffi"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]
# `cdylib` is what foreign bindings load at runtime; `lib` is what the
# `uniffi-bindgen` binary imports to walk the exported metadata.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
livekit-portal = { path = "../livekit-portal" }
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
thiserror = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
ctor = "1"
async-trait = "0.1"
serde_json = "1"
bytes = "1"
