[package]
name = "livekit-portal"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
portal-core = { path = "../portal-core" }
# `rustls-tls-native-roots`: livekit's default feature set doesn't enable any
# TLS backend (its comment: "By default ws TLS is not enabled"). Without this
# the signal client's HTTPS requests (/settings/regions, the WSS upgrade) fail
# against LiveKit Cloud. Matches livekit-ffi's default.
livekit = { version = "0.9.1", features = ["rustls-tls-native-roots"] }
yuv-sys = "0.3.14"
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread"] }
futures-util = "0.3"
bytes = "1"
log = { workspace = true }
serde_json = "1"

[build-dependencies]
# MJPEG encodes with the libjpeg-turbo inside libwebrtc (see csrc/). Keep this
# on the version webrtc-sys builds with, so both find the same prebuilt.
cc = "1"
webrtc-sys-build = "0.3.19"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
